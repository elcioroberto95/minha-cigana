name: Verificar app

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Expo e API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_NO_TELEMETRY: '1'
      TEST_DATABASE_URL: postgresql://cigana:cigana-ci@127.0.0.1:5433/cigana
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_DB: cigana
          POSTGRES_USER: cigana
          POSTGRES_PASSWORD: cigana-ci
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cigana -d cigana"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:api
      - run: npm run build:web
      - name: Abrir a tela inicial no Chrome
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory apps/mobile/dist > "$RUNNER_TEMP/expo-web.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 5 --retry-connrefused http://127.0.0.1:4173/ > /dev/null
          timeout 30s google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom http://127.0.0.1:4173/ > "$RUNNER_TEMP/expo-home.html"
          grep -Fq -e 'O que te trouxe aqui hoje?' -e 'What brings you here today?' "$RUNNER_TEMP/expo-home.html"
