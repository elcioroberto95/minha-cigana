name: Verificar app

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Expo e API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_NO_TELEMETRY: '1'
      TEST_DATABASE_URL: postgresql://cigana:cigana-ci@127.0.0.1:5433/cigana
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_DB: cigana
          POSTGRES_USER: cigana
          POSTGRES_PASSWORD: cigana-ci
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cigana -d cigana"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:api
      - run: npm run build:web
      - name: Abrir a tela inicial no Chrome
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory apps/mobile/dist > "$RUNNER_TEMP/expo-web.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 5 --retry-connrefused http://127.0.0.1:4173/ > /dev/null
          node .github/scripts/check-expo-home.mjs
      - name: Subir a API isolada
        run: |
          docker build --file deploy/api.Dockerfile --tag cigana-api:ci .
          docker run --rm --network host --env DATABASE_URL="$TEST_DATABASE_URL" cigana-api:ci node scripts/migrate.mjs
          container_id=$(docker run --detach --network host --env HOST=127.0.0.1 --env PORT=3000 --env DATABASE_URL="$TEST_DATABASE_URL" cigana-api:ci)
          trap 'docker logs "$container_id"; docker rm --force "$container_id" >/dev/null' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/health | grep -Fx '{"status":"ok"}'

  deploy:
    name: Atualizar API na VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: vps
    concurrency:
      group: cigana-vps
      cancel-in-progress: false
    steps:
      - name: Publicar o commit validado
        env:
          SSH_HOST: ${{ vars.VPS_SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Configure VPS_SSH_HOST}" "${SSH_PRIVATE_KEY:?Configure VPS_DEPLOY_SSH_KEY}" "${SSH_KNOWN_HOSTS:?Configure VPS_SSH_KNOWN_HOSTS}"
          umask 077
          key="$RUNNER_TEMP/cigana-deploy"
          known_hosts="$RUNNER_TEMP/cigana-known-hosts"
          trap 'rm -f "$key" "$known_hosts"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_hosts"
          ssh -n -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o UserKnownHostsFile="$known_hosts" "root@$SSH_HOST" "$GITHUB_SHA"
